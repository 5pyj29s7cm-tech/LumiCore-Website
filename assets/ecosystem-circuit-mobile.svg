<svg xmlns="http://www.w3.org/2000/svg" width="520" height="660" viewBox="0 0 520 660" role="img" aria-labelledby="mobile-circuit-title mobile-circuit-desc">
  <title id="mobile-circuit-title">LumiCore 设备连接架构</title>
  <desc id="mobile-circuit-desc">为手机独立排版的架构图。中央 LumiCore 芯片连接上方的电脑与智能家居、两侧的外部智能体与机器人、下方的 MCP 工具与汽车。</desc>
  <defs>
    <pattern id="mobile-paper-grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".65" fill="#34332f" opacity=".12"/></pattern>
    <linearGradient id="mobile-chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#343632"/><stop offset="1" stop-color="#20231f"/></linearGradient>
    <filter id="mobile-shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#37342d" flood-opacity=".15"/></filter>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
      .device{fill:none;stroke:#343631;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .detail{stroke:#76776d;stroke-width:1.6}
      .copper{stroke:#ab6c43}
      .label{fill:#343631;font-size:24px;font-weight:600;text-anchor:middle}
      .trace{fill:none;stroke:#7c806f;stroke-width:1.7;stroke-linejoin:round}
      .via{fill:#eee9df;stroke:#a46c49;stroke-width:1.8}
    </style>
  </defs>
  <rect width="520" height="660" fill="#eee9df"/>
  <rect x="20" y="20" width="480" height="620" fill="url(#mobile-paper-grid)"/>
  <text x="26" y="34" fill="#74776d" font-size="13" letter-spacing="1.4">LUMICORE / CONNECTED SYSTEM</text>
  <path d="M26 49h468M26 606h468" stroke="#b7b7a9" opacity=".7"/>

  <!-- Vertical routing uses separate top and bottom chip ports. -->
  <g class="trace">
    <path d="M112 181v24l22 22h86v13M120 181v20l18 18h90v21"/>
    <path d="M408 181v24l-22 22h-86v13M400 181v20l-18 18h-90v21"/>
    <path d="M135 310h33M139 318h29"/>
    <path d="M385 310h-33M381 318h-29"/>
    <path d="M220 418v24h-86l-22 22v17M228 418v32h-90l-18 18v13"/>
    <path d="M300 418v24h86l22 22v17M292 418v32h90l18 18v13"/>
  </g>
  <g fill="none" stroke="#ad724b" stroke-width="2"><path d="M220 229v11M300 229v11M150 310h18M352 310h18M220 418v13M300 418v13"/></g>
  <g class="via"><circle cx="112" cy="181" r="3"/><circle cx="408" cy="181" r="3"/><circle cx="135" cy="310" r="3"/><circle cx="385" cy="310" r="3"/><circle cx="112" cy="481" r="3"/><circle cx="408" cy="481" r="3"/></g>

  <g class="device" transform="translate(74 74)">
    <rect width="76" height="49" rx="4"/><path d="M0 40h76M30 49v11m16-11v11M20 61h36M-7 69h90l-5 6H-2z"/>
    <path class="detail" d="M9 9h58v23H9zM9 16h58M14 12h1m5 0h1M14 24h22"/>
    <path class="copper" d="m48 23 5 4 8-8"/>
  </g>
  <text class="label" x="112" y="176">电脑</text>
  <g class="device" transform="translate(374 69)">
    <path d="M-4 34 33 4l37 30M4 29v47h58V29M26 76V50h17v26"/><rect x="12" y="38" width="11" height="12" rx="1"/>
    <path class="detail" d="M47 39h8v10h-8M4 68h58M-9 80h84"/>
    <path class="copper" d="M59 6a18 18 0 0 1 21 18M62 13a11 11 0 0 1 11 11"/><circle cx="65" cy="23" r="2" fill="#ab6c43" stroke="none"/>
  </g>
  <text class="label" x="408" y="176">智能家居</text>

