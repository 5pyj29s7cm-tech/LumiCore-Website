  </g>
  <text class="label" x="437" y="379">机器人</text>

  <g class="device" transform="translate(74 490)">
    <path d="M7 7h20v20H7zM50 7h20v20H50zM7 48h20v20H7zM50 48h20v20H50zM27 17h23M17 27v21m43-21v21M27 58h23"/>
    <path class="copper" d="m33 30-7 7 7 7m12-14 7 7-7 7M41 28l-4 18"/>
