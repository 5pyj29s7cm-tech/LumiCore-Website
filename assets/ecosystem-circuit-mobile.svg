  </g>
  <text class="label" x="408" y="588">汽车</text>

  <g stroke="#8a8c7f" stroke-width="4" stroke-linecap="square">
    <path d="M196 240v12m16-12v12m16-12v12m16-12v12m16-12v12m16-12v12m16-12v12m16-12v12m16-12v12M196 406v12m16-12v12m16-12v12m16-12v12m16-12v12m16-12v12m16-12v12m16-12v12m16-12v12M168 272h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12M340 272h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12m-12 16h12"/>
  </g>
  <rect x="180" y="252" width="160" height="160" rx="8" fill="url(#mobile-chip)" stroke="#4b4f44" stroke-width="2" filter="url(#mobile-shadow)"/>
  <rect x="190" y="262" width="140" height="140" rx="3" fill="none" stroke="#686d5b"/>
  <path d="M200 279v-7h7m106 0h7v7M200 379v7h7m106 0h7v-7" fill="none" stroke="#b9865d" stroke-width="1.4"/>
  <text x="260" y="300" fill="#f0eee6" font-size="25" font-weight="650" text-anchor="middle" letter-spacing="-.6">LumiCore</text>
  <path d="M216 314h88" stroke="#ad7952"/>
  <text x="260" y="344" fill="#d5d5c9" font-size="24" text-anchor="middle">记忆 · 身份</text>
  <text x="260" y="375" fill="#d5d5c9" font-size="24" text-anchor="middle">执行</text>
  <text x="26" y="641" fill="#74776d" font-size="24">接入场景示意</text>
  <g stroke="#a6a797" stroke-width="1.2"><path d="M424 634h70m-70 5v-10m23 10v-10m23 10v-10m24 10v-10"/></g>
</svg>
